[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/ppc-lift", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
fepor-core = { path = "crates/core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha1 = "0.10"
thiserror = "2"
ppc750cl = "0.3"
tempfile = "3"
