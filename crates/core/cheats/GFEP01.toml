# Native cheats for GFEP01 (Fire Emblem: Path of Radiance, Europe), ADR 0033: addresses, sizes and values only.
# The funds and event-points fields are in the game's global struct at 0x8033A708 (the debug text "Funds :%7dG" /
# "EvtPts:%7dP" of the game reads +0x18 / +0x1C).

# Funds and bonus EXP are one-shot (kind add / set): the Cheats page has an input and an Apply button, the value is
# written once and never reverted. The caps are the game's: 9,999,999 gold, 99,999 bonus EXP.

[[cheat]]
name = "Add funds"
description = "Adds the typed amount of gold once (cap 9,999,999). Nothing is held or reverted."
game = "GFEP01"
kind = "add"
max = 9999999
[[cheat.write]]
address = 0x8033A720

[[cheat]]
name = "Set funds"
description = "Sets the gold to the typed value once (0 to 9,999,999). Nothing is held or reverted."
game = "GFEP01"
kind = "set"
max = 9999999
[[cheat.write]]
address = 0x8033A720

[[cheat]]
name = "Add bonus EXP"
description = "Adds the typed amount of bonus experience once (cap 99,999). Nothing is held or reverted."
game = "GFEP01"
kind = "add"
max = 99999
[[cheat.write]]
address = 0x8033A724

[[cheat]]
name = "Set bonus EXP"
description = "Sets the bonus experience to the typed value once (0 to 99,999). Nothing is held or reverted."
game = "GFEP01"
kind = "set"
max = 99999
[[cheat.write]]
address = 0x8033A724

[[cheat]]
name = "Ike HP 99 (prologue)"
description = "Held kind: Ike's current HP is held at 99 every frame while on; turning it off puts back the value it had when turned on. The address is where the prologue map keeps Ike; it only applies while Ike's record is there."
game = "GFEP01"
continuous = true
[[cheat.write]]
address = 0x802BBB6C
size = 1
value = 99
[cheat.write.when]
address = 0x802BBB50
size = 4
value = 0x80900E10

# Ike's stats in the prologue map (ADR 0033, ticket #66). The unit object of Ike is at 0x802BB9C4 and keeps a pointer
# to his record at +0x18C (0x802BBB50); the record is a heap object, so every write is guarded by that pointer.
# The record's bytes +0x44..+0x4B are the BASE stats HP, Str, Mag, Skl, Spd, (not Lck), Def, Res: the status
# screen shows base + the class bonus (Ike: HP +1, Str +2, Skl +3, Spd +3), clamped to the class caps.

[[cheat]]
name = "Set Ike current HP (prologue)"
description = "Sets Ike's current HP once. Only while Ike's record is where the prologue map keeps it. The status screen adds the class bonus and limits the result to the class cap."
game = "GFEP01"
kind = "set"
max = 255
[[cheat.write]]
address = 0x802bbb6c
size = 1
[cheat.write.when]
address = 0x802BBB50
value = 0x80900E10

[[cheat]]
name = "Set Ike base max HP (prologue)"
description = "Sets Ike's base HP once. Only while Ike's record is where the prologue map keeps it. The status screen adds the class bonus and limits the result to the class cap."
