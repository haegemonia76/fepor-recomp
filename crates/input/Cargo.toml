[package]
name = "fepor-input"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fepor-runtime.workspace = true
fepor-core.workspace = true
serde.workspace = true
toml.workspace = true
# test-mode lifts the crate's "first thread that calls init" rule: audio and gamepads each own a thread
sdl3 = { version = "0.14", features = ["test-mode"] }

[dev-dependencies]
tempfile.workspace = true

[features]
# As in fepor-audio: SDL3 built from source and linked statically, for release archives.
bundled-sdl = ["sdl3/build-from-source-static"]
